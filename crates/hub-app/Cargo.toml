[package]
name = "hub-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "zigbee-rs-hub application runtime: the device engine on the ZRHP host core, device registry persistence and the WebSocket JSON API sessions"
publish = false

[dependencies]
hub-devices = { workspace = true }
hub-ncp = { workspace = true }
hub-store = { workspace = true }
zigbee-zrhp = { workspace = true, features = ["std"] }
log = "0.4"
miniz_oxide = "0.8"
# Catalog banks, manifest and COSE_Sign1 verification (catalog::).
zdef = { path = "../zdef", features = ["std"] }
serde_json = "1"
hub-core = { workspace = true }
sha2 = "0.10"
base64 = "0.22"

[features]
advanced = ["hub-devices/advanced"]

[dev-dependencies]
zdefc = { path = "../zdefc" }
base64 = "0.22"
ed25519-compact = { version = "2.1", default-features = false }
hub-ncp = { workspace = true, features = ["sim"] }
