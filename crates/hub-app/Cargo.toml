[package]
name = "hub-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "zigbee-rs-hub application runtime: the device engine on a coordinator backend (ZRHP host core, EZSP), device registry persistence and the WebSocket JSON API sessions"
publish = false

[dependencies]
hub-coord = { workspace = true }
hub-devices = { workspace = true }
hub-store = { workspace = true }
hub-ota = { workspace = true, optional = true }
# Coordinator backends (features `zrhp`, `ezsp`; at least one for a hub).
hub-ncp = { workspace = true, optional = true }
hub-ezsp = { workspace = true, optional = true }
log = "0.4"
miniz_oxide = "0.8"
# Catalog banks, manifest and COSE_Sign1 verification (catalog::).
zdef = { path = "../zdef", features = ["std"] }
serde_json = "1"
hub-core = { workspace = true }
sha2 = "0.10"
base64 = "0.22"

[features]
default = ["ota-store", "zrhp"]
# The ZRHP backend (`hub-ncp`): `Backend::zrhp`, `App::start`, `App::start_with`.
zrhp = ["dep:hub-ncp"]
# The EZSP backend (`hub-ezsp`, EmberZNet NCPs): `Backend::ezsp`.
ezsp = ["dep:hub-ezsp"]
advanced = ["hub-devices/advanced"]
# The Zigbee OTA Upgrade server (cluster 0x0019, `hub-ota`) with streamed
# images. Without it `ota/*` requests answer `unsupported`, `hub/info` has
# no `ota` and OTA cluster commands take the engine's generic path.
ota = ["dep:hub-ota"]
# The OTA image store (uploads into the inactive app slot of the 8 MB
# layout). Without it the OTA server serves streamed images only.
ota-store = ["ota", "hub-ota/store"]

[dev-dependencies]
zdefc = { path = "../zdefc" }
base64 = "0.22"
ed25519-compact = { version = "2.1", default-features = false }
hub-ncp = { workspace = true, features = ["sim"] }
hub-ezsp = { workspace = true, features = ["sim"] }
zigbee-zrhp = { workspace = true, features = ["std"] }
# The device simulator answering the hub's traffic in the baseline scenario.
hub-devices = { workspace = true, features = ["sim"] }
