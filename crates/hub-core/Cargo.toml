[package]
name = "hub-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable core of zigbee-rs-hub: Thread BR board wiring, NCP reset/boot line logic and the ZRHP protocol crate"
publish = false

[dependencies]
zigbee-zrhp = { workspace = true }
# The setup AP's token proof and claim commitment (`setup`).
sha2 = { version = "0.10", default-features = false }

[features]
default = []
std = ["zigbee-zrhp/std"]
