[package]
name = "hub-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "zigbee-rs-hub host store: log-structured journal on raw flash (hubdata), file or RAM, and CRC-32C"
publish = false

[dependencies]
# The Dongle-M `files` region layout (`files`); no default features: no ZRHP.
hub-core = { workspace = true }

[dev-dependencies]
# Cross-check of the CRC against the ZRHP crate's implementation.
zigbee-zrhp = { workspace = true }
# Real LittleFS images (upstream littlefs v2.9) for the files-region tests:
# the walk against lfs_fs_traverse, restored images mounted and read back.
littlefs2-sys = { version = "0.4", features = ["malloc"] }
