[package]
name = "hub-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The hub's embedded web UI: one static page, gzip-compressed at build time, talking only to the WebSocket JSON API"
publish = false

[features]
advanced = []
# The page of an image with the OTA image store (8 MB): uploads to the
# store instead of serving files from the browser tab.
ota-store = []

[build-dependencies]
miniz_oxide = "0.8"
sha2 = "0.10"

[dev-dependencies]
miniz_oxide = "0.8"
