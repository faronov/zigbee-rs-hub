[package]
name = "zdefc-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebAssembly build of zdefc for the hub web UI (spec 14.4, D15)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zdefc = { path = "../zdefc" }
zdef = { path = "../zdef" }
wasm-bindgen = "0.2"
