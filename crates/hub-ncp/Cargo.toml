[package]
name = "hub-ncp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable ZRHP host core of zigbee-rs-hub (std): session/resume, ARQ, client API, NCP lifecycle, NCP firmware update, the ZRHP coordinator backend (hub-coord); re-exports the host store (hub-store)"
publish = false

[dependencies]
hub-coord = { workspace = true }
hub-store = { workspace = true }
zigbee-zrhp = { workspace = true, features = ["std"] }
log = "0.4"
sha2 = { version = "0.10", default-features = false }

[features]
default = []
# In-process simulated NCP (`sim`), used by the tests and by `hubctl --sim`.
sim = []
