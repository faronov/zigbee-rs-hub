[package]
name = "hub-devices"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Device and entity engine of zigbee-rs-hub: interview, generic ZCL tier, definitions, Tuya EF00, Green Power, WebSocket API model"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
miniz_oxide = "0.8"
typed-arena = "2"
base64 = "0.22"
# Definition model, canonical CBOR, expression VM and matching (branch zdef).
zdef = { path = "../zdef", features = ["std"] }
# Green Power commissioning payload decoder and the GP default translation
# (shared with the zigbee-rs NCP/sink), spec 13.2 and 13.8; workspace rev.
zigbee-gp = { workspace = true }

[features]
# The device simulator of the host tests (`testutil::sim`), for
# `hubctl --sim-devices`.
sim = []

[dev-dependencies]
zdefc = { path = "../zdefc" }
heapless = "0.9"
serde_yaml = "0.9"
proptest = "1"
