[package]
name = "hub-ezsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host-side ASH + EZSP protocol core for EmberZNet NCPs (std, sans-IO link, blocking host, simulated NCP) and the EZSP coordinator backend (hub-coord)"
publish = false

[dependencies]
hub-coord = { workspace = true, optional = true }
log = { version = "0.4", optional = true }

[features]
default = ["coord"]
# The EZSP coordinator backend (`coord`): hub-coord's Coordinator and
# NetworkAdmin over the host. Without it the crate is the std-only ASH +
# EZSP core.
coord = ["dep:hub-coord", "dep:log"]
# In-process simulated EmberZNet NCP speaking ASH + EZSP over an in-memory
# byte pipe with fault injection (tests, later `hubctl --sim`).
sim = []
