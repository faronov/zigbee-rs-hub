permit_join:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: zigbee_rs_hub
    duration:
      default: 254
      selector:
        number:
          min: 0
          max: 254
          unit_of_measurement: s
    include_gp:
      default: false
      selector:
        boolean:
    device_id:
      selector:
        device:
          integration: zigbee_rs_hub
reinterview_device:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zigbee_rs_hub
reconfigure_device:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zigbee_rs_hub
update_catalog:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: zigbee_rs_hub
    force:
      default: false
      selector:
        boolean:
    base_url:
      example: "https://faronov.github.io/zigbee-rs-definitions/latest"
      selector:
        text:
          type: url
