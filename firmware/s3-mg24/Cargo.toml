[package]
name = "zrh-s3-mg24"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "zigbee-rs-hub gateway firmware: ESP32-S3 SuperMini + RF-BM-MG24B1 bench setup"
publish = false

[[bin]]
name = "zrh-s3-mg24"
harness = false
test = false

[dependencies]
esp-idf-svc = "0.53"
hub-core = { workspace = true }
zrh-gateway = { path = "../gateway" }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["firmware/gateway/sdkconfig.defaults", "firmware/s3-mg24/sdkconfig.defaults"]
