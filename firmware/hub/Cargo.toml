[package]
name = "tbr-hub"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Phase 1: zigbee-rs-hub on the ESP32-S3 of the Thread BR board: ZRHP host (hub mode) with the phase-0 USB bridge kept as the default mode"
publish = false

[[bin]]
name = "tbr-hub"
harness = false
test = false

[dependencies]
esp-idf-svc = "0.53"
hub-core = { workspace = true }
hub-ncp = { workspace = true, optional = true }
hub-app = { workspace = true, optional = true }
hub-web = { workspace = true, optional = true }
hub-mqtt = { workspace = true, optional = true }
embedded-svc = { version = "0.29", optional = true }
serde_json = { version = "1", optional = true }
log = "0.4"
tbr-bridge = { path = "../bridge" }
# ESP-IDF glue shared with firmware/gateway (heap, panic recorder, HTTP
# server, WebSocket API, logs, MQTT transport, catalog flash).
zrh-espapp = { path = "../espapp" }

[features]
default = ["zrhp", "app"]
# The coordinator backend; exactly one (`compile_error!` otherwise). The
# Thread BR board's H2 NCP speaks ZRHP: the only one this firmware has.
# Implied like `app`: build.rs does not mark it in the image.
zrhp = ["dep:hub-ncp", "hub-app?/zrhp"]
# The application (device engine, registry) with its WebSocket JSON API over
# Wi-Fi and JSON lines on CDC 0. Without it (`--no-default-features`): the
# phase-1 hub (ZRHP host core only).
app = ["dep:hub-app", "dep:hub-web", "dep:embedded-svc", "dep:serde_json", "zrh-espapp/app"]
# Manual ZCL/Tuya console and frame viewer: in the 8 MB images (its web
# tab behind the hub's developer mode, Settings › Hub), also buildable for
# 4 MB. Every image detects PSRAM at boot (`resources`).
advanced = ["app", "hub-app/advanced", "hub-web/advanced"]
# The developer edition ("devtools": the tbr-hub-<ver>-8mb-devtools[-opi]
# images, with `ota-store`): the developer tools of the web UI always on,
# without the developer mode switch; `hub/info` `edition` "devtools".
dev = ["advanced", "hub-web/dev", "hub-app/dev"]
# The Zigbee2MQTT-compatible MQTT bridge (esp-mqtt, plain TCP; settings in
# NVS, off until enabled). Included in both BR flash layouts by
# tools/build-hub-firmware.sh; a build without it answers `unsupported`.
mqtt = ["app", "dep:hub-mqtt", "zrh-espapp/mqtt"]
# The same bridge on its own MQTT 3.1.1 client over lwIP sockets instead of
# esp-mqtt (which links esp-tls and the mbedtls TLS layer even for plain
# TCP). An option, off in every image.
mqtt-lite = ["mqtt", "zrh-espapp/mqtt-lite"]
# The Zigbee OTA Upgrade server for the devices (cluster 0x0019) with
# streamed images (an API client holds the file). Not in the 4 MB images:
# tools/build-hub-firmware.sh enables it, through `ota-store`, in the 8 MB
# images only.
ota = ["app", "hub-app/ota", "hub-web/ota"]
# The devices' OTA image store in the inactive app slot of the 8 MB
# production layout (the 4 MB dev layout has no second app slot).
ota-store = ["ota", "hub-app/ota-store", "hub-web/ota-store"]

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["firmware/bridge/sdkconfig.defaults", "firmware/hub/sdkconfig.defaults"]
