[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# `-s32c1i`: Rust atomics (std included, built here) call ESP-IDF's
# `__atomic_*` functions instead of the S32C1I instruction, which is not
# atomic between the two cores on PSRAM, where the Rust heap is
# (firmware/espapp/src/alloc.rs). rustc warns that the feature is unstable.
rustflags = ["--cfg", "espidf_time64", "-C", "target-feature=-s32c1i"]

[unstable]
build-std = ["std", "panic_abort"]
# No backtrace symbolisation (gimli/addr2line); panic messages stay.
# Not `optimize_for_size`: its stable sort is inlined into every caller
# with a 4 KiB stack buffer (the app thread used 13 KB more stack and the
# hub crashed at start-up), although it saves 63 KB of sort code.
build-std-features = []
# Source paths in panic locations and debug info without the build
# machine's prefixes (std: /rustc/<commit>/library/..., crates.io:
# index.crates.io-<hash>/<crate>-<version>/..., the workspace relative):
# shorter strings, the same image wherever it is built. Not
# `-Zlocation-detail=none` (another 73 KB): the crash record's panic
# message keeps its file and line.
trim-paths = true

[profile.release]
trim-paths = "all"

[env]
MCU = "esp32s3"
# Pinned so local and CI builds use the same ESP-IDF.
ESP_IDF_VERSION = "v5.5.1"
# The workspace root has no [package]; tell esp-idf-sys whose metadata
# (sdkconfig.defaults, esp_tinyusb component) to use.
ESP_IDF_SYS_ROOT_CRATE = "tbr-hub"

