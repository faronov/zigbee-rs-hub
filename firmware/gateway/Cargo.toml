[package]
name = "zrh-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "zigbee-rs-hub gateway firmware library for board profiles: SONOFF Dongle-M (ESP32 + EFR32MG24, Ethernet) and the ESP32-S3 SuperMini + RF-BM-MG24B1 bench setup"
publish = false

[lib]
name = "zrh_gateway"
harness = false
test = false
doctest = false

[dependencies]
esp-idf-svc = "0.53"
embedded-svc = "0.29"
hub-core = { workspace = true }
hub-ncp = { workspace = true }
hub-app = { workspace = true }
log = "0.4"

[build-dependencies]
embuild = "0.33"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(esp32)", "cfg(esp32s3)"] }
