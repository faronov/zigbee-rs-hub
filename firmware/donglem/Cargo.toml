[package]
name = "zrh-donglem"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "zigbee-rs-hub gateway firmware: SONOFF Dongle-M (ESP32-D0WDR2-V3 + EFR32MG24)"
publish = false

[[bin]]
name = "zrh-donglem"
harness = false
test = false

[dependencies]
esp-idf-svc = "0.53"
hub-core = { workspace = true }
zrh-gateway = { path = "../gateway" }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["firmware/gateway/sdkconfig.defaults", "firmware/donglem/sdkconfig.defaults"]
