[package]
name = "zrh-donglem"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "zigbee-rs-hub for the SONOFF Dongle Max (Dongle-M: ESP32-D0WDR2-V3 + EFR32MG24 with SONOFF's EmberZNet NCP): the hub application on the EZSP backend, installed into ota_1 of SONOFF's partition table"
publish = false

[[bin]]
name = "zrh-donglem"
harness = false
test = false

[dependencies]
esp-idf-svc = "0.53"
hub-core = { workspace = true }
zrh-gateway = { path = "../gateway" }

[features]
# The MQTT bridge on its own client instead of esp-mqtt (in no image).
mqtt-lite = ["zrh-gateway/mqtt-lite"]

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["firmware/gateway/sdkconfig.defaults", "firmware/donglem/sdkconfig.defaults"]
