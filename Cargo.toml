[workspace]
resolver = "2"
members = ["crates/hub-core", "crates/hub-store", "crates/hub-coord", "crates/hub-ncp", "crates/hub-devices", "crates/hub-ota", "crates/hub-app", "crates/hub-web", "crates/hub-mqtt", "crates/hub-ezsp", "crates/zdef", "crates/zdefc", "crates/zdefc-wasm", "tools/hubctl", "firmware/bridge", "firmware/espapp", "firmware/hub", "firmware/gateway", "firmware/donglem"]
# Host-side `cargo test` at the root only builds the portable crates and the
# desktop tool; the firmware is built from `firmware/bridge`,
# `firmware/hub` and `firmware/donglem` (Xtensa toolchain, see README;
# `firmware/espapp` and `firmware/gateway` are their shared libraries).
default-members = ["crates/hub-core", "crates/hub-store", "crates/hub-coord", "crates/hub-ncp", "crates/hub-devices", "crates/hub-ota", "crates/hub-app", "crates/hub-web", "crates/hub-mqtt", "crates/hub-ezsp", "crates/zdef", "crates/zdefc", "tools/hubctl"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faronov/zigbee-rs-hub"
rust-version = "1.90"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-store = { path = "crates/hub-store" }
hub-coord = { path = "crates/hub-coord" }
hub-ncp = { path = "crates/hub-ncp" }
hub-ezsp = { path = "crates/hub-ezsp" }
hub-devices = { path = "crates/hub-devices" }
hub-ota = { path = "crates/hub-ota", default-features = false }
hub-app = { path = "crates/hub-app", default-features = false }
hub-web = { path = "crates/hub-web" }
hub-mqtt = { path = "crates/hub-mqtt" }
# zigbee-rs crates, all at one master revision (0607d31, 2026-11-27, PR #22):
# ZRHP v1 protocol crate and the Green Power commissioning decoder and
# default translation used by the device engine.
zigbee-zrhp = { git = "https://github.com/faronov/zigbee-rs", rev = "0607d3195e1c79498cf3afe804388453fdf8116b", default-features = false }
zigbee-gp = { git = "https://github.com/faronov/zigbee-rs", rev = "0607d3195e1c79498cf3afe804388453fdf8116b", features = ["sink"] }

[profile.release]
opt-level = "z"
codegen-units = 1
debug = true
lto = "fat"

[profile.dev]
opt-level = "z"
debug = true

# Size-optimised WebAssembly build of zdefc (crates/zdefc-wasm).
[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = false
lto = true
codegen-units = 1
