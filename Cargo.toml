[workspace]
resolver = "2"
members = ["crates/hub-core", "crates/hub-ncp", "crates/hub-devices", "crates/hub-app", "crates/hub-web", "crates/hub-mqtt", "crates/zdef", "crates/zdefc", "crates/zdefc-wasm", "tools/hubctl", "firmware/bridge", "firmware/hub"]
# Host-side `cargo test` at the root only builds the portable crates and the
# desktop tool; the firmware is built from `firmware/bridge` and
# `firmware/hub` (Xtensa toolchain, see README).
default-members = ["crates/hub-core", "crates/hub-ncp", "crates/hub-devices", "crates/hub-app", "crates/hub-web", "crates/hub-mqtt", "crates/zdef", "crates/zdefc", "tools/hubctl"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faronov/zigbee-rs-hub"
rust-version = "1.90"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-ncp = { path = "crates/hub-ncp" }
hub-devices = { path = "crates/hub-devices" }
hub-app = { path = "crates/hub-app" }
hub-web = { path = "crates/hub-web" }
hub-mqtt = { path = "crates/hub-mqtt" }
# zigbee-rs crates, all at one master revision (c18875b, 2026-11-20):
# ZRHP v1 protocol crate and the Green Power commissioning decoder and
# default translation used by the device engine.
zigbee-zrhp = { git = "https://github.com/faronov/zigbee-rs", rev = "c18875b3eab28afcd7472d9857ad1375293be878", default-features = false }
zigbee-gp = { git = "https://github.com/faronov/zigbee-rs", rev = "c18875b3eab28afcd7472d9857ad1375293be878", features = ["sink"] }

[profile.release]
opt-level = "z"
codegen-units = 1
debug = true
lto = "fat"

[profile.dev]
opt-level = "z"
debug = true

# Size-optimised WebAssembly build of zdefc (crates/zdefc-wasm).
[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = false
lto = true
codegen-units = 1
