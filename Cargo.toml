[workspace]
resolver = "2"
members = ["crates/hub-core", "crates/hub-ncp", "crates/hub-devices", "crates/hub-app", "crates/zdef", "crates/zdefc", "crates/zdefc-wasm", "tools/hubctl", "firmware/bridge", "firmware/hub", "firmware/gateway", "firmware/donglem", "firmware/s3-mg24"]
# Host-side `cargo test` at the root only builds the portable crates and the
# desktop tool; the firmware is built from `firmware/bridge`,
# `firmware/hub`, `firmware/donglem` and `firmware/s3-mg24` (Xtensa
# toolchain, see README).
default-members = ["crates/hub-core", "crates/hub-ncp", "crates/hub-devices", "crates/hub-app", "crates/hub-app", "crates/zdef", "crates/zdefc", "tools/hubctl"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faronov/zigbee-rs-hub"
rust-version = "1.90"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-ncp = { path = "crates/hub-ncp" }
hub-devices = { path = "crates/hub-devices" }
hub-app = { path = "crates/hub-app" }
# zigbee-rs crates, all at one master revision (7c4f96c, 2026-11-20):
# ZRHP v1 protocol crate and the Green Power commissioning decoder and
# default translation used by the device engine.
zigbee-zrhp = { git = "https://github.com/faronov/zigbee-rs", rev = "7c4f96c2328d778169344592f8f50b1ab24ea6b4", default-features = false }
zigbee-gp = { git = "https://github.com/faronov/zigbee-rs", rev = "7c4f96c2328d778169344592f8f50b1ab24ea6b4", features = ["sink"] }

[profile.release]
opt-level = "z"
codegen-units = 1
debug = true
lto = "fat"

[profile.dev]
opt-level = "z"
debug = true

# Size-optimised WebAssembly build of zdefc (crates/zdefc-wasm).
[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = false
lto = true
codegen-units = 1
