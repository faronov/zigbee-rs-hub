[workspace]
resolver = "2"
members = ["crates/hub-core", "crates/hub-ncp", "tools/hubctl", "firmware/bridge", "firmware/hub"]
# Host-side `cargo test` at the root only builds the portable crates and the
# desktop tool; the firmware is built from `firmware/bridge` and
# `firmware/hub` (Xtensa toolchain, see README).
default-members = ["crates/hub-core", "crates/hub-ncp", "tools/hubctl"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faronov/zigbee-rs-hub"
rust-version = "1.90"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-ncp = { path = "crates/hub-ncp" }
# ZRHP v1 protocol crate from zigbee-rs (batch merge 2026-11-20: RTS/CTS NCP,
# GP translation commands 0x0A08-0x0A0D; 2ab8ac0).
zigbee-zrhp = { git = "https://github.com/faronov/zigbee-rs", rev = "2ab8ac0400a437717e3ad3a99229b31ada8646e7", default-features = false }

[profile.release]
opt-level = "s"
codegen-units = 1
debug = true

[profile.dev]
opt-level = "z"
debug = true
