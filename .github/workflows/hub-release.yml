name: Hub release

# Tagged hub release: `git tag hub-v0.1.0 && git push origin hub-v0.1.0`.
#
# The tag must match firmware/hub/Cargo.toml (and its Cargo.lock entry) and
# CONFIG_APP_PROJECT_VER ("tbr-hub-<version>") in firmware/hub/sdkconfig.defaults;
# tools/release-images.py also reads the version back from the built app.
# A tag with a suffix (hub-v0.2.0-rc.1) makes a pre-release. The release
# carries, for the Thread Border Router board's S3 with 8 MB (production A/B
# layout) and 4 MB (dev layout): full flash image, bootloader, partition
# table, blank otadata (8 MB), app, plus the tbr-bridge app,
# release-manifest.json (the web flasher's input) and SHA256SUMS.
#
# Pinned: Xtensa Rust 1.90.0.0, ESP-IDF v5.5.1 (embuild), esptool, --locked;
# no Cargo build cache, SOURCE_DATE_EPOCH from the commit.
#
# The web flasher (https://faronov.github.io/zigbee-rs/flasher/) lives in
# faronov/zigbee-rs. With the secret FLASHER_DISPATCH_TOKEN (fine-grained
# token, Contents: read and write on faronov/zigbee-rs) this workflow asks
# it to rebuild right away; otherwise its six-hourly refresh picks the
# release up.

on:
    push:
        tags: ['hub-v*']

permissions:
    contents: read

concurrency:
    group: hub-release-${{ github.ref }}
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always
    XTENSA_RUST: "1.90.0.0"
    ESPTOOL_VERSION: "5.1.0"

jobs:
    build:
        name: Build and publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Tag and version
              id: meta
              run: |
                  set -euo pipefail
                  version="${GITHUB_REF_NAME#hub-v}"
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                    echo "::error::tag $GITHUB_REF_NAME is not hub-vMAJOR.MINOR.PATCH[-PRE]"; exit 1
                  fi
                  cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' firmware/hub/Cargo.toml | head -1)
                  [ "$cargo_version" = "$version" ] \
                    || { echo "::error::tag $GITHUB_REF_NAME but firmware/hub/Cargo.toml has $cargo_version"; exit 1; }
                  awk '/^name = "tbr-hub"$/{getline; print}' Cargo.lock | grep -qx "version = \"$version\"" \
                    || { echo "::error::Cargo.lock is not at tbr-hub $version"; exit 1; }
                  grep -qx "CONFIG_APP_PROJECT_VER=\"tbr-hub-$version\"" firmware/hub/sdkconfig.defaults \
                    || { echo "::error::firmware/hub/sdkconfig.defaults CONFIG_APP_PROJECT_VER is not tbr-hub-$version"; exit 1; }
                  {
                    echo "version=$version"
                    echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
                    echo "epoch=$(git log -1 --format=%ct)"
                    echo "date=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
                  } >>"$GITHUB_OUTPUT"
            - uses: esp-rs/xtensa-toolchain@v1.7.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  default: true
                  buildtargets: esp32s3
                  ldproxy: true
                  version: ${{ env.XTENSA_RUST }}
            # ESP-IDF (pinned v5.5.1) and crate sources, as saved by ci.yml on
            # main; restored only, never saved from a tag. No target/ cache.
            - name: Restore ESP-IDF and crate sources
              uses: actions/cache/restore@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      .embuild
                  key: bridge-${{ runner.os }}-idf-v5.5.1-${{ hashFiles('Cargo.lock', 'components_esp32s3.lock') }}
                  restore-keys: bridge-${{ runner.os }}-idf-v5.5.1-
            - name: Build tbr-bridge and tbr-hub
              env:
                  SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
              run: |
                  set -euo pipefail
                  (cd firmware/bridge && cargo build --release --locked)
                  # The 4 MB dev image: without the OTA image store.
                  (cd firmware/hub && cargo build --release --locked --no-default-features --features app)
                  cp target/xtensa-esp32s3-espidf/release/tbr-hub target/tbr-hub-4mb-dev.elf
                  (cd firmware/hub && cargo build --release --locked)
                  # Octal PSRAM variant (N4R8/N8R8/N16R8 modules): ESP-IDF fixes the mode at build time.
                  opi() {
                    (cd firmware/hub && ESP_IDF_SDKCONFIG_DEFAULTS="firmware/bridge/sdkconfig.defaults;firmware/hub/sdkconfig.defaults;firmware/hub/sdkconfig.octal" \
                      CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-opi" cargo build --release --locked "$@")
                  }
                  opi --no-default-features --features app
                  cp target-opi/xtensa-esp32s3-espidf/release/tbr-hub target-opi/tbr-hub-4mb-dev.elf
                  opi
            - name: Release images
              run: |
                  set -euo pipefail
                  pip install --quiet "esptool==${ESPTOOL_VERSION}"
                  toolchain=$(jq -cn --arg rust "esp $XTENSA_RUST" --arg esptool "$ESPTOOL_VERSION" '{"xtensa-rust": $rust, esptool: $esptool, "esp-idf": "v5.5.1"}')
                  python3 tools/release-images.py --version "${{ steps.meta.outputs.version }}" --tag "$GITHUB_REF_NAME" \
                    --commit "$GITHUB_SHA" --date "${{ steps.meta.outputs.date }}" --toolchain "$toolchain" --out dist
                  ls -l dist
            - name: Release notes
              run: |
                  set -euo pipefail
                  python3 - <<'EOF' >notes.md
                  import json
                  m = json.load(open("dist/release-manifest.json"))
                  zrhp = f", ZRHP {m['zrhp']['protocol']}" if m.get("zrhp") else ""
                  print(f"zigbee-rs hub {m['version']}{zrhp}, commit `{m['commit'][:12]}`; "
                        + ", ".join(f"{k} {v}" for k, v in m["components"].items()) + ".\n")
                  print("**Web flasher:** https://faronov.github.io/zigbee-rs/flasher/ (Chrome or Edge; updates keep Wi-Fi settings and `hubdata` unless you choose to erase).\n")
                  print("| Board | Layout | Full flash image (offset 0x0, erases everything) | App |")
                  print("|---|---|---|---|")
                  for b in m["boards"]:
                      app = b["files"]["app"]
                      print(f"| {b['title']} | `{b['layout']}` | `{b['files']['merged']['name']}` | `{app['name']}` at 0x{app['offset']:X} |")
                  print("\nWith esptool, a first install (erases the S3):")
                  print("```\nesptool --chip esp32s3 --port <PORT> write-flash 0x0 tbr-hub-<v>-<8mb|4mb-dev>[-opi]-merged.bin\n```")
                  print("`-opi` images: modules with octal PSRAM (`esptool chip-id` shows \"Embedded PSRAM 8MB\" or 16MB: WROOM-1 N4R8/N8R8/N16R8); "
                        "the others: quad PSRAM (\"Embedded PSRAM 2MB\"/4MB: N4R2/N8R2, S3FH4R2) or none. A wrong choice boots without PSRAM.")
                  print("Update keeping `nvs` and `hubdata` (8 MB layout; the 4 MB dev layout has no otadata and its app is at 0x10000):")
                  print("```\nesptool --chip esp32s3 --port <PORT> write-flash 0x0 <...-bootloader.bin> 0x8000 <...-partition-table.bin> 0xF000 <...-otadata-blank.bin> 0x20000 <...-app.bin>\n```")
                  for f in m.get("extra_files", []):
                      print(f"\n`{f['name']}`: {f['role']}.")
                  print("\nVerify downloads with `SHA256SUMS`; `release-manifest.json` describes every image.")
                  EOF
                  cat notes.md
                  prev=$(git tag --list 'hub-v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
                  echo "prev=$prev" >>"$GITHUB_ENV"
            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRERELEASE: ${{ steps.meta.outputs.prerelease }}
              run: |
                  set -euo pipefail
                  args=(--verify-tag --title "zigbee-rs hub ${{ steps.meta.outputs.version }}" --notes-file notes.md --generate-notes)
                  [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
                  [ "$PRERELEASE" = true ] && args+=(--prerelease)
                  gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*
            - name: Ask the web flasher to rebuild
              env:
                  TOKEN: ${{ secrets.FLASHER_DISPATCH_TOKEN }}
              run: |
                  if [ -z "$TOKEN" ]; then
                    echo "::notice::FLASHER_DISPATCH_TOKEN is not set: the web flasher picks this release up at its next scheduled refresh (within 6 h), or run site-refresh.yml in faronov/zigbee-rs"
                    exit 0
                  fi
                  GH_TOKEN="$TOKEN" gh api repos/faronov/zigbee-rs/dispatches -f event_type=flasher-release \
                    -F "client_payload[tag]=$GITHUB_REF_NAME" \
                    || echo "::warning::repository_dispatch to faronov/zigbee-rs failed; the scheduled refresh will pick the release up"
