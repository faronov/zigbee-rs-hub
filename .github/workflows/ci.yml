name: CI

on:
  push:
    branches: [main, stage2]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: hub-core, hub-ncp, hub-mqtt, hubctl (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test -p hub-core -p hub-store -p hub-coord -p hub-ncp -p hub-app -p hub-web -p hub-mqtt -p hubctl -p hub-ezsp
      - name: hub-store links no ZRHP code
        run: "! cargo tree -p hub-store -e normal | grep -q zigbee-zrhp"
      - name: hub-coord stays backend-neutral (no hub-store, hub-ncp or zigbee-zrhp)
        run: |
          deps=$(cargo tree -p hub-coord -e normal --prefix none)
          if grep -E '^(zigbee-zrhp|hub-ncp|hub-store) ' <<<"$deps"; then exit 1; fi
      - name: hub-ezsp fmt, clippy, and no ZRHP or hub-ncp dependency (ASH + EZSP core, simulated NCP, EZSP backend)
        run: |
          cargo fmt -p hub-ezsp -- --check
          cargo clippy -p hub-ezsp --all-targets --all-features -- -D warnings
          deps=$(cargo tree -p hub-ezsp -e normal --prefix none)
          if grep -E '^(zigbee-zrhp|hub-ncp) ' <<<"$deps"; then exit 1; fi
      - name: hub-ezsp core without the backend (std only)
        run: |
          cargo test -p hub-ezsp --no-default-features
          deps=$(cargo tree -p hub-ezsp --no-default-features -e normal --prefix none)
          if [ "$(wc -l <<<"$deps")" -ne 1 ]; then echo "$deps"; exit 1; fi
      # hubctl enables `advanced`; the images without it build hub-mqtt alone.
      - name: hub-mqtt without the advanced console
        run: cargo test -p hub-mqtt
      - name: S3 flashing helpers (partition offsets from the device's table)
        run: python3 -m unittest discover -s tools/flow -p 'test_*.py'
      - name: Firmware build selection, release image checks, size accounting
        run: python3 -m unittest tools/test_hub_build.py tools/test_release_images.py tools/test_size_report.py tools/test_make_otadata.py

  home-assistant:
    name: Home Assistant integration (ruff, pytest, e2e against hubctl --sim serve)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/home-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component follows HA's Python.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: integrations/home-assistant/requirements-test.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Build hubctl and zdefc (the end-to-end tests run its simulated hub and sign a test catalog)
        working-directory: .
        run: cargo build -p hubctl -p zdefc
      - name: pytest
        run: HUBCTL="$GITHUB_WORKSPACE/target/debug/hubctl" python -m pytest -v

  hub-devices:
    name: hub-devices (engine host tests, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p hub-coord -p hub-devices -- --check
      - run: cargo clippy -p hub-coord -p hub-devices --all-targets -- -D warnings
      - run: cargo test -p hub-devices
      - run: cargo test -p hub-devices --features advanced
      - run: cargo test -p hub-app -p hub-web --no-default-features
      - run: cargo test -p hub-web --features advanced

  zdef:
    name: zdef + zdefc (host tests, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p zdef -p zdefc -p zdefc-wasm -- --check
      - run: cargo clippy -p zdef -p zdefc -p zdefc-wasm --all-targets -- -D warnings
      - run: cargo test -p zdef -p zdefc
      - name: Examples check and size table
        run: |
          cargo run -q -p zdefc -- check definitions/examples
          cargo run -q -p zdefc -- measure definitions/examples

  zdef-nostd:
    name: zdef no_std (thumbv7em proxy, xtensa-esp32s3) + code size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - run: cargo build -p zdef --release --target thumbv7em-none-eabihf
      - name: Feature subsets (hub configuration without software SHA-256 / miniz)
        run: |
          for f in "" bank sign "bank,sign" "bank,sign,miniz" "soft-sha256"; do
            echo "features: [$f]"
            cargo build -q -p zdef --release --target thumbv7em-none-eabihf --no-default-features --features "$f"
          done
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; unauthenticated calls hit the rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: false
          buildtargets: esp32s3
          version: "1.90.0.0"
      - name: Build for xtensa-esp32s3 (hub target, Rust 1.90)
        working-directory: crates/zdef
        run: cargo +esp build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
      - name: Code size per entry point
        run: |
          export PATH="$(dirname "$(find "$(rustc +stable --print sysroot)" -name llvm-size | head -1)"):$PATH"
          XTENSA_GCC="$(find "$HOME/.rustup/toolchains/esp" -name xtensa-esp32s3-elf-gcc -type f | head -1)"
          echo "xtensa gcc: $XTENSA_GCC"
          XTENSA_GCC="$XTENSA_GCC" RUSTUP_TOOLCHAIN=stable tools/zdef-size/measure.sh

  zdefc-wasm:
    name: zdefc WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: cargo build -p zdefc-wasm --profile wasm --target wasm32-unknown-unknown
      - name: wasm-bindgen, size, Node smoke test
        run: |
          wasm-bindgen --target nodejs --remove-name-section --remove-producers-section --out-dir target/zdefc-wasm-node target/wasm32-unknown-unknown/wasm/zdefc_wasm.wasm
          wasm-bindgen --target web --remove-name-section --remove-producers-section --out-dir target/zdefc-wasm-web target/wasm32-unknown-unknown/wasm/zdefc_wasm.wasm
          ls -l target/zdefc-wasm-web/zdefc_wasm_bg.wasm
          echo "gzip: $(gzip -9 -c target/zdefc-wasm-web/zdefc_wasm_bg.wasm | wc -c) B"
          node crates/zdefc-wasm/tests/smoke.js target/zdefc-wasm-node .
      - uses: actions/upload-artifact@v4
        with:
          name: zdefc-wasm
          path: target/zdefc-wasm-web

  firmware:
    name: tbr-bridge + tbr-hub firmware (ESP32-S3, esp-idf-svc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; unauthenticated runners hit its rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
          # Same Xtensa Rust as the local builds (last release with an x86_64 macOS host build).
          version: "1.90.0.0"
      - name: Cache ESP-IDF and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .embuild
          key: bridge-${{ runner.os }}-idf-v5.5.1-${{ hashFiles('Cargo.lock', 'components_esp32s3.lock') }}
          restore-keys: bridge-${{ runner.os }}-idf-v5.5.1-
      - name: Build tbr-bridge
        working-directory: firmware/bridge
        run: cargo build --release
      - name: Build tbr-hub without the application (ZRHP host core only)
        working-directory: firmware/hub
        run: cargo build --release --no-default-features
      - name: Build tbr-hub with the MQTT bridge on its own client (option mqtt-lite, in no image)
        working-directory: firmware/hub
        run: cargo build --release --features mqtt-lite
      - name: Build tbr-hub (8 MB images with the MQTT bridge, 4 MB dev images without; quad and octal PSRAM)
        run: tools/build-hub-firmware.sh
      - name: App images (tbr-hub must fit the 3 MiB production slot, with MQTT, and the 2 944 KiB dev slot)
        run: |
          pip install --quiet "esptool>=5,<6"
          tools/make-app-image.sh release target/tbr-bridge-app.bin tbr-bridge
          TARGET_DIR=target-8mb FLASH_SIZE=8MB MAX_APP_BYTES=3145728 tools/make-app-image.sh release target/tbr-hub-8mb-app.bin tbr-hub
          TARGET_DIR=target-8mb-opi FLASH_SIZE=8MB MAX_APP_BYTES=3145728 tools/make-app-image.sh release target/tbr-hub-8mb-opi-app.bin tbr-hub
          FLASH_SIZE=4MB MAX_APP_BYTES=3014656 tools/make-app-image.sh release target/tbr-hub-4mb-dev-app.bin tbr-hub
          TARGET_DIR=target-opi FLASH_SIZE=4MB MAX_APP_BYTES=3014656 tools/make-app-image.sh release target/tbr-hub-4mb-dev-opi-app.bin tbr-hub
      - name: Partition tables (8 MB production, 4 MB dev)
        run: |
          tools/make-partition-table.sh firmware/hub/partitions-8mb.csv target/partitions-8mb.bin 8MB
          tools/make-partition-table.sh firmware/hub/partitions-4mb-dev.csv target/partitions-4mb-dev.bin 4MB
      - name: Release images (dry run of hub-release.yml's assembly and version checks)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' firmware/hub/Cargo.toml | head -1)
          python3 tools/release-images.py --version "$version" --tag "hub-v$version" --commit "$GITHUB_SHA" --out target/release-dryrun
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            target/tbr-bridge-app.bin
            target/tbr-hub-8mb-app.bin
            target/tbr-hub-8mb-opi-app.bin
            target/tbr-hub-4mb-dev-app.bin
            target/tbr-hub-4mb-dev-opi-app.bin
            target/partitions-8mb.bin
            target/partitions-4mb-dev.bin
            target/release-dryrun/
            target/xtensa-esp32s3-espidf/release/tbr-bridge
            target/xtensa-esp32s3-espidf/release/tbr-hub

  donglem:
    name: zrh-donglem firmware (SONOFF Dongle Max, classic ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; unauthenticated runners hit its rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
          version: "1.90.0.0"
      - name: Cache ESP-IDF and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .embuild
          key: donglem-${{ runner.os }}-idf-v5.5.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: donglem-${{ runner.os }}-idf-v5.5.1-
      - name: Rust atomics without S32C1I (the target enables it; firmware/donglem/.cargo/config.toml removes it)
        run: |
          default=$(rustc +esp --print cfg --target xtensa-esp32-espidf)
          flagged=$(rustc +esp --print cfg --target xtensa-esp32-espidf -C target-feature=-s32c1i 2>/dev/null)
          grep -qx 'target_feature="s32c1i"' <<<"$default"
          if grep -qx 'target_feature="s32c1i"' <<<"$flagged"; then echo "-s32c1i did not remove the feature"; exit 1; fi
          grep -q '"target-feature=-s32c1i"' firmware/donglem/.cargo/config.toml
      - name: Build zrh-donglem
        working-directory: firmware/donglem
        run: cargo build --release
      - name: No S32C1I in Rust code (disassembly, attributed through the line table)
        run: tools/check-s32c1i.sh "$(find .embuild/espressif/tools -name xtensa-esp32-elf-objdump -type f | head -1)" target/xtensa-esp32-espidf/release/zrh-donglem
      - name: App image (DIO 40 MHz, chip v3.0+; must fit the 6 MiB ota_1 slot of SONOFF's stock table)
        run: |
          pip install --quiet "esptool>=5,<6"
          CHIP=esp32 FLASH_SIZE=16MB FLASH_FREQ=40m MIN_REV_FULL=300 MAX_APP_BYTES=6291456 tools/make-app-image.sh release target/zrh-donglem-app.bin zrh-donglem
      - name: Partition table identical to SONOFF's stock one, otadata sector selecting ota_1
        run: |
          tools/make-partition-table.sh firmware/donglem/partitions.csv target/partitions-donglem.bin 16MB
          echo "639d27a0418b260e0242fa6d4c93514bf5273c2ffd22f6229066ebac21f3ca66  target/partitions-donglem.bin" | sha256sum -c
          python3 tools/make-otadata.py --seq 2 -o target/otadata-donglem-ota1.bin
      - name: Static RAM (internal DRAM/IRAM)
        run: |
          size="$(find .embuild/espressif/tools -name xtensa-esp32-elf-size -type f | head -1)"
          "$size" -A target/xtensa-esp32-espidf/release/zrh-donglem | grep -E "^\.(iram0\.text|dram0\.(data|bss)|flash\.(text|rodata)) "
      - uses: actions/upload-artifact@v4
        with:
          name: donglem-firmware
          path: |
            target/zrh-donglem-app.bin
            target/partitions-donglem.bin
            target/otadata-donglem-ota1.bin
            target/xtensa-esp32-espidf/release/zrh-donglem
