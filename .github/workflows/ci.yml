name: CI

on:
  push:
    branches: [main, stage2]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: hub-core, hub-ncp (incl. Gecko bootloader client), hub-app, hubctl (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p hub-core -p hub-ncp -p hub-app -p hubctl

  hub-devices:
    name: hub-devices (engine host tests, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p hub-devices -- --check
      - run: cargo clippy -p hub-devices --all-targets -- -D warnings
      - run: cargo test -p hub-devices

  zdef:
    name: zdef + zdefc (host tests, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p zdef -p zdefc -p zdefc-wasm -- --check
      - run: cargo clippy -p zdef -p zdefc -p zdefc-wasm --all-targets -- -D warnings
      - run: cargo test -p zdef -p zdefc
      - name: Examples check and size table
        run: |
          cargo run -q -p zdefc -- check definitions/examples
          cargo run -q -p zdefc -- measure definitions/examples

  zdef-nostd:
    name: zdef no_std (thumbv7em proxy, xtensa-esp32s3) + code size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - run: cargo build -p zdef --release --target thumbv7em-none-eabihf
      - name: Feature subsets (hub configuration without software SHA-256 / miniz)
        run: |
          for f in "" bank sign "bank,sign" "bank,sign,miniz" "soft-sha256"; do
            echo "features: [$f]"
            cargo build -q -p zdef --release --target thumbv7em-none-eabihf --no-default-features --features "$f"
          done
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; unauthenticated calls hit the rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: false
          buildtargets: esp32s3
          version: "1.90.0.0"
      - name: Build for xtensa-esp32s3 (hub target, Rust 1.90)
        working-directory: crates/zdef
        run: cargo +esp build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
      - name: Code size per entry point
        run: |
          export PATH="$(dirname "$(find "$(rustc +stable --print sysroot)" -name llvm-size | head -1)"):$PATH"
          XTENSA_GCC="$(find "$HOME/.rustup/toolchains/esp" -name xtensa-esp32s3-elf-gcc -type f | head -1)"
          echo "xtensa gcc: $XTENSA_GCC"
          XTENSA_GCC="$XTENSA_GCC" RUSTUP_TOOLCHAIN=stable tools/zdef-size/measure.sh

  zdefc-wasm:
    name: zdefc WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: cargo build -p zdefc-wasm --profile wasm --target wasm32-unknown-unknown
      - name: wasm-bindgen, size, Node smoke test
        run: |
          wasm-bindgen --target nodejs --remove-name-section --remove-producers-section --out-dir target/zdefc-wasm-node target/wasm32-unknown-unknown/wasm/zdefc_wasm.wasm
          wasm-bindgen --target web --remove-name-section --remove-producers-section --out-dir target/zdefc-wasm-web target/wasm32-unknown-unknown/wasm/zdefc_wasm.wasm
          ls -l target/zdefc-wasm-web/zdefc_wasm_bg.wasm
          echo "gzip: $(gzip -9 -c target/zdefc-wasm-web/zdefc_wasm_bg.wasm | wc -c) B"
          node crates/zdefc-wasm/tests/smoke.js target/zdefc-wasm-node .
      - uses: actions/upload-artifact@v4
        with:
          name: zdefc-wasm
          path: target/zdefc-wasm-web

  firmware:
    name: tbr-bridge + tbr-hub firmware (ESP32-S3, esp-idf-svc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; unauthenticated runners hit its rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
          # Same Xtensa Rust as the local builds (last release with an x86_64 macOS host build).
          version: "1.90.0.0"
      - name: Cache ESP-IDF and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .embuild
          key: bridge-${{ runner.os }}-idf-v5.5.1-${{ hashFiles('Cargo.lock', 'components_esp32s3.lock') }}
          restore-keys: bridge-${{ runner.os }}-idf-v5.5.1-
      - name: Build tbr-bridge
        working-directory: firmware/bridge
        run: cargo build --release
      - name: Build tbr-hub without the application (ZRHP host core only)
        working-directory: firmware/hub
        run: cargo build --release --no-default-features
      - name: Build tbr-hub (application)
        working-directory: firmware/hub
        run: cargo build --release
      - name: App images (tbr-hub must fit the 3 MiB production slot and the 2 944 KiB dev slot)
        run: |
          pip install --quiet "esptool>=5,<6"
          tools/make-app-image.sh release target/tbr-bridge-app.bin tbr-bridge
          FLASH_SIZE=8MB MAX_APP_BYTES=3145728 tools/make-app-image.sh release target/tbr-hub-8mb-app.bin tbr-hub
          FLASH_SIZE=4MB MAX_APP_BYTES=3014656 tools/make-app-image.sh release target/tbr-hub-4mb-dev-app.bin tbr-hub
      - name: Partition tables (8 MB production, 4 MB dev)
        run: |
          tools/make-partition-table.sh firmware/hub/partitions-8mb.csv target/partitions-8mb.bin 8MB
          tools/make-partition-table.sh firmware/hub/partitions-4mb-dev.csv target/partitions-4mb-dev.bin 4MB
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            target/tbr-bridge-app.bin
            target/tbr-hub-8mb-app.bin
            target/tbr-hub-4mb-dev-app.bin
            target/partitions-8mb.bin
            target/partitions-4mb-dev.bin
            target/xtensa-esp32s3-espidf/release/tbr-bridge
            target/xtensa-esp32s3-espidf/release/tbr-hub

  gateway:
    name: gateway firmware (Dongle-M ESP32, S3 SuperMini + MG24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; unauthenticated runners hit its rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32,esp32s3
          ldproxy: true
          version: "1.90.0.0"
      - name: Cache ESP-IDF and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .embuild
          key: gateway-${{ runner.os }}-idf-v5.5.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: gateway-${{ runner.os }}-idf-v5.5.1-
      - name: Build zrh-donglem (classic ESP32)
        working-directory: firmware/donglem
        run: cargo build --release
      - name: Build zrh-s3-mg24 (ESP32-S3)
        working-directory: firmware/s3-mg24
        run: cargo build --release
      - name: App images (Dongle-M in the 4 MiB slot of the 16 MB layout, SuperMini in the 2 944 KiB dev slot)
        run: |
          pip install --quiet "esptool>=5,<6"
          CHIP=esp32 FLASH_SIZE=16MB MIN_REV_FULL=300 MAX_APP_BYTES=4194304 tools/make-app-image.sh release target/zrh-donglem-app.bin zrh-donglem
          CHIP=esp32s3 FLASH_SIZE=4MB MAX_APP_BYTES=3014656 tools/make-app-image.sh release target/zrh-s3-mg24-app.bin zrh-s3-mg24
      - name: Partition tables and bootloaders
        run: |
          tools/make-partition-table.sh firmware/gateway/partitions-16mb.csv target/partitions-16mb.bin 16MB
          tools/make-partition-table.sh firmware/hub/partitions-4mb-dev.csv target/partitions-4mb-dev.bin 4MB
          cp "$(ls target/xtensa-esp32-espidf/release/build/esp-idf-sys-*/out/build/bootloader/bootloader.bin | head -1)" target/bootloader-donglem.bin
          cp "$(ls target/xtensa-esp32s3-espidf/release/build/esp-idf-sys-*/out/build/bootloader/bootloader.bin | head -1)" target/bootloader-s3-mg24.bin
      - name: Static RAM (internal DRAM/IRAM)
        run: |
          for t in esp32:zrh-donglem esp32s3:zrh-s3-mg24; do
            chip=${t%%:*}; app=${t#*:}
            size="$(find .embuild/espressif/tools -name "xtensa-$chip-elf-size" -type f | head -1)"
            echo "== $app"
            "$size" -A "target/xtensa-$chip-espidf/release/$app" | grep -E "^\.(iram0\.text|dram0\.(data|bss)|flash\.(text|rodata)) "
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-firmware
          path: |
            target/zrh-donglem-app.bin
            target/zrh-s3-mg24-app.bin
            target/partitions-16mb.bin
            target/partitions-4mb-dev.bin
            target/bootloader-donglem.bin
            target/bootloader-s3-mg24.bin
            target/xtensa-esp32-espidf/release/zrh-donglem
            target/xtensa-esp32s3-espidf/release/zrh-s3-mg24
