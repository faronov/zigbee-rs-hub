[package]
name = "hubctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Desktop runner of the zigbee-rs-hub ZRHP host core (the real NCP through the phase-0 bridge, or a simulated NCP) and of the hub app on the EZSP backend's simulated NCP"
publish = false

[dependencies]
hub-ncp = { workspace = true, features = ["sim"] }
hub-app = { workspace = true, features = ["advanced", "ota-store", "zrhp", "ezsp"] }
# `--backend ezsp --sim`: the simulated EmberZNet NCP.
hub-ezsp = { workspace = true, features = ["sim"] }
hub-ota = { workspace = true, features = ["store"] }
sha2 = "0.10"
# `--sim-devices`: the engine's device simulator behind the simulated NCP.
hub-devices = { workspace = true, features = ["sim"] }
zigbee-zrhp = { workspace = true, features = ["std"] }
hub-web = { workspace = true, features = ["advanced", "ota-store"] }
hub-mqtt = { workspace = true }
serde_json = "1"
# `catalog-push`: the catalog mirror over HTTPS.
ureq = "3"
base64 = "0.22"
tungstenite = "0.29"
log = "0.4"
# No libudev: the tool only opens a port by path.
serialport = { version = "4.7", default-features = false }
