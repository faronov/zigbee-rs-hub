[package]
name = "hubctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Desktop runner of the zigbee-rs-hub ZRHP host core: the real NCP through the phase-0 bridge, or a simulated NCP"
publish = false

[dependencies]
hub-ncp = { workspace = true, features = ["sim"] }
hub-app = { workspace = true }
hub-web = { workspace = true }
serde_json = "1"
tungstenite = "0.29"
log = "0.4"
# No libudev: the tool only opens a port by path.
serialport = { version = "4.7", default-features = false }
